<script>
//全局状态
let timer = null;
const REFRESH_SEC = 3;

//【模拟拉取榜单函数】
//真实使用：这里替换成请求你的榜单接口；抖音magic页面浏览器前端无法直接跨域访问webcast.amemv.com小玩法接口，需要后端代理中转拿数据
async function fetchRankData(){
    //====模拟数据开始====
    const mockNames = [
        "DL.寂","DL.星愿","小风9233","DL.逃","DL.梦伴","DL.毒","罗","DL.休","DL.小任好困","DL.小卓",
        "DL.褐色","R.山药","R.雪音","呼吸","Xy.宙斯","DL.汉堡","v.妖蝠","y.kis","DL.心语","DL.09",
        "DL.断线","Xy.Feng","Rc.雨天","Xy.Ro7","R.one","DL.陆逊","Xy.肘子大王","天","Rc.hush","Rc.冲冲",
        "Xy.伊关","y.凤九","Xy.小皇少","DL.也许","Rc.樊樊","Xy.小一","Xy.早点","DL.羊"
    ];
    const list = mockNames.map((name,idx)=>{
        const baseScore = Math.max(10000 - idx*1200,1200);
        const noise = Math.floor(Math.random()*1800 - 600);
        return {
            name,
            score: Math.max(baseScore + noise, 800),
        }
    })
    //按score降序排序
    list.sort((a,b)=>b.score - a.score);
    list.forEach((it,i)=>it.rank = i+1);
    return list;
    //====模拟数据结束====
    /*
    // 真实接入示例（必须后端代理转发，前端fetch直接调用会跨域报错）
    const resp = await fetch("/api/proxy‑magic‑rank");
    return await resp.json();
    */
}

//计算每一条的变动
function getRankChange(item, lastMap){
    const prev = lastMap.get(item.name);
    if(!prev) return {delta:0, text:"new", cls:""};
    const delta = prev.rank - item.rank;
    if(delta>0){
        return {delta, text:`↑${delta}`, cls:"rank-up"}
    }else if(delta<0){
        return {delta, text:`↓${Math.abs(delta)}`, cls:"rank-down"}
    }else{
        return {delta:0, text:"--", cls:""}
    }
}
